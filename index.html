<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <header>
            <h1>To Do App</h1>
            <button id="togleTheme">togleTheme</button>
        </header>
       
        <div class="main">
            <form id="inputForm" class="form">
                <input type="text" placeholder="Enter Task" name="taskInput" id="taskInput">
                <input type="date" name="dateInput" id="dateInput">
                <button type="submit" name="addTask" id="add">Add Task</button>
            </form>
            <div class="filter">
                <button class="filterBtn active" taskFilter="all">All</button>
                <button class="filterBtn" taskFilter="pending">Pending</button>
                <button class="filterBtn" taskFilter="completed">Completed</button>
            </div>
            <ul id="taskList"></ul>
        </div>
        

    <script src="app.js"></script>
</body>
</html>
